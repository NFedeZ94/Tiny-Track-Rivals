 TR=TRACKS[id]||TRACKS.colazione;
 const N=6000,fine=[];let pv=TR.pt(0),acc=0;fine.push({x:pv.x,y:pv.y,s:0});
 for(let i=1;i<=N;i++){const p=TR.pt(i/N*Math.PI*2);acc+=Math.hypot(p.x-pv.x,p.y-pv.y);fine.push({x:p.x,y:p.y,s:acc});pv=p;}
 TR.fine=fine;
 PATH.length=0;let j=0;
 for(let k=0;k<NPTS;k++){const s=acc*k/NPTS;while(fine[j+1].s<s)j++;const f=(s-fine[j].s)/((fine[j+1].s-fine[j].s)||1);PATH.push({x:fine[j].x+(fine[j+1].x-fine[j].x)*f,y:fine[j].y+(fine[j+1].y-fine[j].y)*f});}
}

// ================= AUDIO (WebAudio, nessun file esterno) =================
const Sfx={
 ctx:null,eng:null,
 init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},
 resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 beep(f,d,type,vol,slide){
  if(!SAVE.sound||!this.ctx)return;
  const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d);
 },
 jingle(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.16,'square',0.12),i*110));},
 count(){this.beep(440,0.18,'square',0.14);},
 go(){this.beep(880,0.4,'square',0.16);},
 hit(v){this.beep(120+Math.random()*40,0.12,'sawtooth',Math.min(0.2,0.04+v*0.0004),60);},
 pick(){this.beep(700,0.1,'triangle',0.14,1400);},
 turbo(){this.beep(300,0.5,'sawtooth',0.12,900);},
 oil(){this.beep(200,0.25,'sine',0.14,80);},
 claw(){this.beep(500,0.2,'square',0.12,250);},
 startEngine(base){
  this.init();if(!this.ctx||this.eng)return;
  const o=this.ctx.createOscillator(),o2=this.ctx.createOscillator(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();
  o.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=700;g.gain.value=0;
  o.connect(f);o2.connect(f);f.connect(g);g.connect(this.ctx.destination);o.start();o2.start();
  this.eng={o,o2,g,f,base};
 },
 engine(sr,base){
  if(!this.eng||!this.ctx)return;
  const e=this.eng,fr=base*(0.8+sr*2.2),t=this.ctx.currentTime;
  e.o.frequency.setTargetAtTime(fr,t,0.08);e.o2.frequency.setTargetAtTime(fr*0.5,t,0.08);
  e.f.frequency.setTargetAtTime(500+sr*1400,t,0.1);
  e.g.gain.setTargetAtTime(SAVE.sound?0.035+sr*0.05:0,t,0.1);
 },
 stopEngine(){
  if(!this.eng)return;
  try{this.eng.g.gain.setTargetAtTime(0,this.ctx.currentTime,0.05);this.eng.o.stop(this.ctx.currentTime+0.3);this.eng.o2.stop(this.ctx.currentTime+0.3);}catch(e){}
  this.eng=null;
 }
};

const ITEM_NAME={turbo:'TURBO',oil:'OLIO',claw:'PINZA'};
class Race extends Phaser.Scene{
 constructor(){super('race');}
 init(d){this.carId=(d&&d.carId)||SAVE.car;}
 create(){
  setTrack(SAVE.track);
  const cam=this.cameras.main;
  cam.setBackgroundColor(0x2a1d14);
  this.uiCam=this.cameras.add(0,0,this.scale.width,this.scale.height);
  this.wd=o=>{this.uiCam.ignore(o);return o;};
  this.ui=o=>{cam.ignore(o);return o;};
  this.worldKey='ttr_w_'+SAVE.track;
  this.buildWorld();
  this.wd(this.add.image(0,0,this.worldKey).setOrigin(0,0).setDepth(0));
  this.props=TR.props.map(d=>this.makeProp(d));
  this.makePowerups();
  this.oils=[];
  this.fx=this.wd(this.add.graphics().setDepth(12));
  const mine=CAR_DEFS.find(c=>c.id===this.carId)||CAR_DEFS[0];
  const others=CAR_DEFS.filter(c=>c.id!==mine.id).slice(0,N_CARS-1);
  this.cars=[mine,...others].map((d,i)=>this.makeCar(d,i));
  this.player=this.cars[0];
  this.order=[...this.cars];
  this.cursors=this.input.keyboard.createCursorKeys();
  this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE,E,SHIFT');
  this.input.addPointer(3);
  this.touch={l:false,r:false,j:false,u:false,uEdge:false};
  this.state='countdown';this.cd=3;this.lastN=4;this.raceT=0;this.viaT=0;this.msgT=0;
  this.ended=false;this.canExit=false;this.hitCd=0;
  this.makeUI();
  cam.setBounds(0,0,W,H);
  cam.startFollow(this.player.pivot,true,0.12,0.12);
  this.applyView();this.layoutUI();
  cam.centerOn(this.player.x,this.player.y);
  this._rs=()=>{this.applyView();this.layoutUI();};
  this.scale.on('resize',this._rs);
  this.input.on('pointerdown',p=>this.onTap(p));
  this.input.keyboard.on('keydown-V',()=>this.toggleView());
  this.input.keyboard.on('keydown-ENTER',()=>{if(this.canExit)this.exit();});

 // ---------- Pinza: bersaglio davanti, entro circa 2 lunghezze auto, cono stretto, linea di vista libera ----------

  const B=BODY[c.d.body]||BODY.hatch,maxD=B.l*2.2,cone=0.27;
  let best=null,bd=1e9;
  for(const t of this.cars){
   if(t===c||t.finished||t.z>14)continue;
   const dx=t.x-c.x,dy=t.y-c.y,d=Math.hypot(dx,dy);
   if(d>maxD||d<1)continue;
   if(Math.abs(Phaser.Math.Angle.Wrap(Math.atan2(dy,dx)-c.a))>cone)continue;
   let blocked=false;
   for(const p of this.props){
    const px=p.x-c.x,py=p.y-c.y,tt=Phaser.Math.Clamp((px*dx+py*dy)/(d*d),0,1);
    if(p.h>6&&Math.hypot(px-dx*tt,py-dy*tt)<p.r*0.8){blocked=true;break;}
   }
   if(blocked)continue;
   if(d<bd){bd=d;best=t;}
  }
  return best;
 }

   g.fillStyle(0x5a4fa0,0.4);g.fillEllipse(-14,-10,22,12);
   g.setPosition(ox,oy);
   this.oils.push({x:ox,y:oy,r:34,t:9,g,owner:c});
   if(me)Sfx.oil();
  }else if(t==='claw'){
   const tg=this.findClawTarget(c);
   if(tg){c.claw={t:tg,time:1.2};tg.slow=0.6;tg.clawFx=0.6;if(me)this.say('PINZA agganciata!');}

 }
 update(time,dtms){
  const dt=Math.min(dtms/1000,0.033);
  this.pollTouch();
  this.hitCd=Math.max(0,this.hitCd-dt);
  if(this.msgT>0){this.msgT-=dt;if(this.msgT<=0)this.msgTx.setText('');}
  if(this.state==='countdown'){
   this.cd-=dt;
   if(this.cd<=0){this.state='race';this.raceT=0;this.viaT=0.8;this.big.setText('VIA!');Sfx.go();}
   else{const n=Math.ceil(this.cd);if(n!==this.lastN){this.lastN=n;this.big.setText(String(n));Sfx.count();}}
  }else{
   this.raceT+=dt;
   if(this.viaT>0){this.viaT-=dt;if(this.viaT<=0&&!this.ended)this.big.setText('');}
  }
  const racing=this.state==='race';
  const p=this.player;
  for(const c of this.cars)c.idx=this.nearestIdx(c);
  if(racing){
   const ks=this.keys;
   if(!p.finished&&(Phaser.Input.Keyboard.JustDown(ks.E)||Phaser.Input.Keyboard.JustDown(ks.SHIFT)||this.touch.uEdge))this.useItem(p);
   for(const c of this.cars){
    if(c.ai&&c.item&&!c.finished){
     c.itemWait-=dt;
     if(c.itemWait<=0&&(c.item!=='claw'||this.findClawTarget(c)))this.useItem(c);
    }
   }
  }
  for(const c of this.cars)this.stepCar(c,dt,racing);
  if(racing){
   this.collide();this.stepProps(dt);this.stepPowerups(dt);this.stepOils(dt);
   for(const c of this.cars)this.progress(c);
  }
  for(const u of this.pus){u.ph+=dt*3;u.rot+=dt*2;this.drawPU(u);}
  this.order=[...this.cars].sort((a,b)=>(b.finished-a.finished)||((a.finished&&b.finished)?(a.finTime-b.finTime):(b.prog-a.prog)));
  if(p.finished&&!this.ended){
   this.ended=true;
   const ps=this.order.indexOf(p)+1;
   this.big.setFontSize(44).setText('Arrivo: '+ps+'\u00b0  ('+p.finTime.toFixed(1)+' s)\nTocca per continuare');
   Sfx.jingle();
   this.time.delayedCall(900,()=>{this.canExit=true;});
  }
  const pos=this.order.indexOf(p)+1;
  this.hud.setText('Pos '+pos+'/'+N_CARS+'   Giro '+Math.min(p.lap+1,LAPS)+'/'+LAPS+'   '+(p.finished?p.finTime:this.raceT).toFixed(1)+' s');
  this.itemTx.setText(p.item?('Oggetto: '+ITEM_NAME[p.item]+'  \u2605'):'');
  Sfx.engine(Math.min(Math.hypot(p.vx,p.vy)/p.d.max,1.3),this.engBase);
  this.drawButtons();
  this.draw(time);
  p.pivot.setPosition(p.x,p.y);
 }
 stepCar(c,dt,racing){
  const d=c.d;
  c.jcd=Math.max(0,c.jcd-dt);c.boost=Math.max(0,c.boost-dt);c.oilT=Math.max(0,c.oilT-dt);
  c.slow=Math.max(0,c.slow-dt);c.clawFx=Math.max(0,c.clawFx-dt);
  let inp;
  if(c.finished)inp=this.aiInput(c,true);
  else if(racing)inp=this.readInput(c);
  else{c.vx=0;c.vy=0;c.w=0;c.tilt*=0.9;c.bob*=0.9;return;}   // griglia: ferme fino al via
  // Pinza: traina l'utilizzatore verso il bersaglio (puo ancora sterzare e frenare)
  if(c.claw){
   const t=c.claw.t,dx=t.x-c.x,dy=t.y-c.y,dd=Math.hypot(dx,dy);
   c.claw.time-=dt;
   if(c.claw.time<=0||t.finished||c.z>8||c.vz>0||dd<c.r+t.r+4||dx*Math.cos(c.a)+dy*Math.sin(c.a)<8)c.claw=null;
   else{c.vx+=dx/dd*1100*dt;c.vy+=dy/dd*1100*dt;}
  }
  // Olio: per circa 1 s si sterza ma l'auto continua a scivolare dritta (niente testacoda)
  if(c.oilT>0){
   c.w+=(inp.steer*d.steer*0.8-c.w)*Math.min(1,6*dt);
   c.a+=c.w*dt;
   c.vx-=c.vx*0.25*dt;c.vy-=c.vy*0.25*dt;
   c.x+=c.vx*dt;c.y+=c.vy*dt;
   c.x=Phaser.Math.Clamp(c.x,110,W-110);c.y=Phaser.Math.Clamp(c.y,110,H-110);
   c.tilt+=((c.w*0.05)-c.tilt)*Math.min(1,8*dt);
   return;
  }
  const fx=Math.cos(c.a),fy=Math.sin(c.a),sx=-fy,sy=fx;
  let vf=c.vx*fx+c.vy*fy,vs=c.vx*sx+c.vy*sy;
  const dist=Math.hypot(PATH[c.idx].x-c.x,PATH[c.idx].y-c.y);
  const off=dist>TRACK_HALF+26;
  const fric=off?0.55:1,air=c.z>1;
  if(inp.jump&&!air&&c.jcd<=0){c.vz=260;c.jcd=1.5;}
  if(air||c.vz>0){c.vz-=900*dt;c.z+=c.vz*dt;if(c.z<=0){c.z=0;c.vz=0;c.bob=-3;}}
  const bst=c.boost>0;
  const vmax=d.max*c.skill*fric*(bst?1.18:1)*(c.slow>0?0.85:1);
  const acc=d.acc*c.skill*fric*(air?0.2:1)*(bst?3.2:1);
  if(inp.thr>0&&vf<vmax)vf+=acc*inp.thr*dt/c.m*(1-Math.min(Math.max(vf,0)/vmax,1)*0.85);
  if(vf>vmax)vf+=(vmax-vf)*Math.min(1,4*dt);
  if(inp.brake>0){
   if(vf>6)vf=Math.max(0,vf-(c.finished?340:700)*inp.brake*dt);
   else if(inp.rev)vf-=260*dt/c.m;
   else vf*=Math.max(0,1-10*dt);
  }
  vf-=vf*0.35*dt;
  vf=Math.max(vf,-170);
  if(c.finished&&Math.abs(vf)<4)vf=0;
  vs-=vs*Math.min(1,d.grip*(air?0.1:1)*(off?0.7:1)*dt);
  const sf=Phaser.Math.Clamp(Math.abs(vf)/160,0,1)*(vf<0?-1:1);
  c.w+=(inp.steer*d.steer*sf*(air?0.35:1)-c.w)*Math.min(1,9*dt);
  c.a+=c.w*dt;
  const nfx=Math.cos(c.a),nfy=Math.sin(c.a);
  c.vx=nfx*vf-nfy*vs;c.vy=nfy*vf+nfx*vs;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  c.x=Phaser.Math.Clamp(c.x,110,W-110);c.y=Phaser.Math.Clamp(c.y,110,H-110);
  c.tilt+=((vs*0.0016+c.w*0.04)-c.tilt)*Math.min(1,8*dt);
  c.bob+=(-c.bob*10*dt);
  if(racing&&!c.finished){if(Math.hypot(c.vx,c.vy)<25)c.stuck+=dt;else c.stuck=Math.max(0,c.stuck-dt*2);}
 }
 progress(c){
  const target=CHECKS[c.cpi];
  let dd=Math.abs(c.idx-target);dd=Math.min(dd,NPTS-dd);
  if(dd<=6){
   if(c.cpi===0){
    if(c.started){c.lap++;if(c.lap>=LAPS&&!c.finished){c.finished=true;c.finTime=this.raceT;}}
    else c.started=true;
   }
   c.cpi=(c.cpi+1)%CHECKS.length;
  }
  const wrap=(c.cpi===1||!c.started)&&c.idx>NPTS*0.6;
  c.prog=c.lap*NPTS+(wrap?c.idx-NPTS:c.idx);
 }
 collide(){
  const cs=this.cars;
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
   const a=cs[i],b=cs[j];
   if(a.finished||b.finished)continue;
   if((a.z>14)!==(b.z>14))continue;
   const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy),mn=a.r+b.r;
   if(dd<mn&&dd>0.001){
    const nx=dx/dd,ny=dy/dd,ov=mn-dd,tm=a.m+b.m;
    a.x-=nx*ov*(b.m/tm);a.y-=ny*ov*(b.m/tm);b.x+=nx*ov*(a.m/tm);b.y+=ny*ov*(a.m/tm);
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rv<0){const jn=-1.35*rv/(1/a.m+1/b.m);a.vx-=jn*nx/a.m;a.vy-=jn*ny/a.m;b.vx+=jn*nx/b.m;b.vy+=jn*ny/b.m;a.bob=Math.min(6,-rv*0.02);b.bob=Math.min(6,-rv*0.02);this.bump(a,-rv);this.bump(b,-rv);}
   }
  }
  for(const c of cs)for(const p of this.props){
   const dx=p.x-c.x,dy=p.y-c.y,dd=Math.hypot(dx,dy),mn=c.r+p.r*0.9;
   if(dd<mn&&dd>0.001&&c.z<p.h){
    const nx=dx/dd,ny=dy/dd,ov=mn-dd,tm=c.m+p.m;
    c.x-=nx*ov*(p.m/tm);c.y-=ny*ov*(p.m/tm);p.x+=nx*ov*(c.m/tm);p.y+=ny*ov*(c.m/tm);
    const rv=(p.vx-c.vx)*nx+(p.vy-c.vy)*ny;
    if(rv<0){const jn=-1.25*rv/(1/c.m+1/p.m);c.vx-=jn*nx/c.m;c.vy-=jn*ny/c.m;p.vx+=jn*nx/p.m;p.vy+=jn*ny/p.m;c.bob=Math.min(7,-rv*0.025);p.spin=(Math.random()-0.5)*4;this.bump(c,-rv);}
   }
  }
 }
 bump(c,v){
  if(v>30&&c.claw)c.claw=null;
  if(c===this.player&&this.hitCd<=0&&v>40){Sfx.hit(v);this.hitCd=0.12;}
 }
 stepProps(dt){
  for(const p of this.props){
   p.x+=p.vx*dt;p.y+=p.vy*dt;
   const f=Math.exp(-2.2*dt);p.vx*=f;p.vy*=f;
   p.rot+=p.spin*dt;p.spin*=Math.exp(-3*dt);
   p.x=Phaser.Math.Clamp(p.x,110,W-110);p.y=Phaser.Math.Clamp(p.y,110,H-110);
   for(const q of this.props){if(q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,dd=Math.hypot(dx,dy),mn=p.r+q.r;if(dd<mn&&dd>0.001){const nx=dx/dd,ny=dy/dd,ov=(mn-dd)/2;p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;}}
   p.sh.setPosition(p.x+7,p.y+10);p.g.setPosition(p.x,p.y);p.g.setRotation(p.rot);
  }
 }
 stepPowerups(dt){
  for(const u of this.pus){
   if(!u.on){u.cd-=dt;if(u.cd<=0)u.on=true;continue;}
   for(const c of this.cars){
    if(c.item||c.finished||c.z>10)continue;
    const B=BODY[c.d.body]||BODY.hatch;
    if(Math.hypot(c.x-u.x,c.y-u.y)<12+B.w/2){
     c.item=['turbo','oil','claw'][Math.floor(Math.random()*3)];
     c.itemWait=1+Math.random()*2;
     u.on=false;u.cd=10;
     if(c===this.player)Sfx.pick();
     break;
    }
   }
  }
 }
 stepOils(dt){
  for(let i=this.oils.length-1;i>=0;i--){
   const o=this.oils[i];o.t-=dt;
   if(o.t<=0){o.g.destroy();this.oils.splice(i,1);continue;}
   o.g.setAlpha(Math.min(1,o.t/2));
   for(const c of this.cars){
    if(c.oilT>0||c.finished||c.z>8)continue;
    if(c===o.owner&&o.t>8)continue;
    if(Math.hypot(c.x-o.x,c.y-o.y)<o.r+8){c.oilT=1.0;if(c===this.player)Sfx.oil();}
   }
  }
 }
 drawButtons(){
  const g=this.btnG;g.clear();

 }else{
  layer(6,()=>{g.fillStyle(0x222222,1);g.fillRoundedRect(-5,-4.5,10,9,2);},0.4);
  layer(11,()=>{g.lineStyle(2.5,0x222222,1);g.strokeRect(B.c0,-hw+1,B.c1-B.c0+6,BW-2);g.fillStyle(0xf2f2f2,1);g.fillCircle(-1,0,4.2);g.fillStyle(0x1b1b1b,1);g.fillRect(0.5,-3,3,6);},0.8);
 }
}
// ================= MENU =================
class Menu extends Phaser.Scene{
 constructor(){super('menu');}
 create(){
  const w=this.scale.width,h=this.scale.height,u=Math.min(w,h);
  this.cameras.main.setBackgroundColor(0x2a1d14);
  const bg=this.add.graphics();
  bg.fillStyle(0x8b5a2b,1);bg.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=44){bg.fillStyle(((y/44)|0)%2?0x94622f:0x84552a,1);bg.fillRect(0,y,w,42);}
  const T=(x,y,s,sz,col,sw)=>this.add.text(x,y,s,{fontFamily:'monospace',fontSize:Math.floor(sz)+'px',color:col,stroke:'#000000',strokeThickness:sw||5,align:'center'}).setOrigin(0.5);
  T(w/2,h*0.17,'TINY TRACK RIVALS',Math.min(u*0.12,w/13),'#ffd23f',8);
  const bw=Math.min(w*0.4,380),bh=Math.max(50,h*0.12),xa=w/2-bw*0.56,xb=w/2+bw*0.56;
  const btn=(cx,cy,label,fn,col)=>{
   const r=this.add.rectangle(cx,cy,bw,bh,col).setStrokeStyle(5,0x3a1d08).setInteractive();
   const t=T(cx,cy,label,Math.min(bh*0.42,bw/14.9),'#ffffff',4);
   r.on('pointerdown',()=>r.setAlpha(0.7));
   r.on('pointerout',()=>r.setAlpha(1));
   r.on('pointerup',()=>{r.setAlpha(1);Sfx.resume();fn(t);});
  };
  const y1=h*0.42,y2=h*0.58,y3=h*0.74;
  const trkLabel=()=>'PISTA: '+TRACKS[SAVE.track].name.toUpperCase();
  const viewLabel=()=>'VISTA: '+(SAVE.view==='tilt'?'INCLINATA':'ALTO');
  btn(xa,y1,'GARA VELOCE',()=>{Sfx.jingle();this.scene.start('race',{carId:SAVE.car});},0xd62828);
  btn(xb,y1,trkLabel(),(t)=>{SAVE.track=(SAVE.track==='colazione')?'desk':'colazione';saveGame();t.setText(trkLabel());},0x556b2f);
  btn(xa,y2,'GARAGE',()=>this.scene.start('garage'),0x2b6cb0);
  btn(xb,y2,viewLabel(),(t)=>{SAVE.view=(SAVE.view==='tilt')?'top':'tilt';saveGame();t.setText(viewLabel());},0x556b2f);
  const car=CAR_DEFS.find(c=>c.id===SAVE.car)||CAR_DEFS[0];
  T(xa,y3,'Auto: '+car.n,Math.min(bh*0.4,bw/14),'#ffffff',4);
  btn(xb,y3,'SUONO: '+(SAVE.sound?'SI':'NO'),(t)=>{SAVE.sound=!SAVE.sound;saveGame();t.setText('SUONO: '+(SAVE.sound?'SI':'NO'));if(SAVE.sound)Sfx.jingle();},0x556b2f);
  const rs=()=>this.scene.restart();
  this.scale.on('resize',rs);
  this.events.once('shutdown',()=>this.scale.off('resize',rs));
 }
}
// ================= GARAGE =================
class Garage extends Phaser.Scene{
 constructor(){super('garage');}
 init(d){this.sel=(d&&typeof d.sel==='number')?d.sel:Math.max(0,CAR_DEFS.findIndex(c=>c.id===SAVE.car));}
 create(){
  const w=this.scale.width,h=this.scale.height;
  this.cameras.main.setBackgroundColor(0x1f2a33);
  this.add.rectangle(w/2,h/2,w,h,0x24323d);
  const tx=(x,y,s,sz,col,o)=>this.add.text(x,y,s,Object.assign({fontFamily:'monospace',fontSize:Math.max(11,Math.floor(sz))+'px',color:col||'#ffffff',stroke:'#000000',strokeThickness:3},o||{}));
  tx(w/2,26,'GARAGE',h*0.085,'#ffd23f',{strokeThickness:7}).setOrigin(0.5);
  const pw=Math.min(w*0.36,320),gx=14,gy=58,gw=w-pw-gx*2-14,gh=h-gy-66;
  const cols=4,gap=10,cw=(gw-gap*(cols-1))/cols,ch=(gh-gap)/2;
  CAR_DEFS.forEach((c,i)=>{
   const cx=gx+(i%cols)*(cw+gap)+cw/2,cy=gy+Math.floor(i/cols)*(ch+gap)+ch/2;
   const unl=SAVE.unlocked.includes(c.id),selc=(i===this.sel);
   const card=this.add.rectangle(cx,cy,cw,ch,selc?0x3a5a2a:0x30424f).setStrokeStyle(selc?6:3,selc?0xffd23f:0x111111).setInteractive();
   card.on('pointerup',()=>this.scene.restart({sel:i}));
   const g=this.add.graphics();g.setPosition(cx,cy-ch*0.06);
   g.setScale(Math.min(cw*0.62/54,ch*0.4/34));
   CarArt(g,unl?c:Object.assign({},c,{col:0x555555}),0,0,-0.45,0,0);
   tx(cx,cy+ch*0.3,c.n,cw*0.11,unl?'#ffffff':'#999999').setOrigin(0.5);
   if(c.id===SAVE.car)tx(cx,cy-ch*0.4,'IN USO',cw*0.09,'#ffd23f').setOrigin(0.5);
   else if(!unl)tx(cx,cy-ch*0.4,'BLOCCATA',cw*0.09,'#ff8888').setOrigin(0.5);
  });
  const px=w-pw-14,ph=h-gy-66,c=CAR_DEFS[this.sel],unl=SAVE.unlocked.includes(c.id),use=(c.id===SAVE.car);
  this.add.rectangle(px+pw/2,gy+ph/2,pw,ph,0x1a252e).setStrokeStyle(3,0x111111);
  const lx=px+12;
  tx(lx,gy+8,c.n,h*0.055,'#ffffff',{strokeThickness:4});
  tx(lx,gy+8+h*0.075,c.desc,h*0.036,'#cfe8ff',{strokeThickness:2,wordWrap:{width:pw-24}});
  const labs=['Velocit\u00e0','Accel.','Sterzo','Grip','Impatto','Stabil.'];
  const sy=gy+8+h*0.075+h*0.16;
  labs.forEach((l,k)=>{
   const yy=sy+k*h*0.05,bx=lx+pw*0.36,bw=pw*0.5,bh2=Math.max(6,h*0.02);
   tx(lx,yy,l,h*0.032,'#ffffff',{strokeThickness:2});
   this.add.rectangle(bx+bw/2,yy+h*0.015,bw,bh2,0x0d1318);
   this.add.rectangle(bx+bw*c.stats[k]/20,yy+h*0.015,bw*c.stats[k]/10,bh2,0xffd23f);
  });
  const by=gy+ph-h*0.06,label=use?'IN USO':(unl?'SCEGLI':'BLOCCATA'),colb=use?0x3a5a2a:(unl?0xd62828:0x555555);
  const b=this.add.rectangle(px+pw/2,by,pw-24,h*0.09,colb).setStrokeStyle(4,0x3a1d08);
  tx(px+pw/2,by,label,h*0.05,'#ffffff',{strokeThickness:4}).setOrigin(0.5);
  if(unl&&!use){b.setInteractive();b.on('pointerup',()=>{SAVE.car=c.id;saveGame();this.scene.restart({sel:this.sel});});}
  const bk=this.add.rectangle(110,h-32,180,Math.max(44,h*0.1),0xd62828).setStrokeStyle(4,0x3a1d08).setInteractive();
  tx(110,h-32,'INDIETRO',h*0.05,'#ffffff',{strokeThickness:4}).setOrigin(0.5);
  bk.on('pointerup',()=>this.scene.start('menu'));
  const rs=()=>this.scene.restart({sel:this.sel});
  this.scale.on('resize',rs);
  this.events.once('shutdown',()=>this.scale.off('resize',rs));
 }
}
// ================= AVVIO =================
function fitGame(){const el=document.getElementById('game');el.style.width=window.innerWidth+'px';el.style.height=window.innerHeight+'px';}
fitGame();
window.addEventListener('resize',fitGame);
window.addEventListener('orientationchange',()=>setTimeout(fitGame,250));
new Phaser.Game({
 type:Phaser.AUTO,parent:'game',backgroundColor:'#1b1410',
 scale:{mode:Phaser.Scale.RESIZE,width:window.innerWidth,height:window.innerHeight},
 input:{activePointers:4},
 scene:[Menu,Garage,Race]
});
</script>
