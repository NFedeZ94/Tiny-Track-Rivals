<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tiny Track Rivals</title>
<style>
html,body{margin:0;height:100%;background:#1b1410;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#game{width:100vw;height:100vh}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
// ===== PARAMETRI =====
const W=1600,H=1000,LAPS=3,N_CARS=6;
const CENTER={x:800,y:500},RX=560,RY=330;
function trackPoint(t){return{x:CENTER.x+Math.cos(t)*RX*(1+0.12*Math.cos(3*t)),y:CENTER.y+Math.sin(t)*RY*(1+0.10*Math.sin(2*t))};}
const TRACK_HALF=95;
const NPTS=120;
const PATH=[];for(let i=0;i<NPTS;i++)PATH.push(trackPoint(i/NPTS*Math.PI*2));
const CHECKS=[0,30,60,90];
const PROPS=[
 {k:'tazza',t:6,off:-20,r:30,m:3.0,c:0xf4f0e8,h:26},
 {k:'biscotto',t:16,off:30,r:22,m:1.0,c:0xc98a4b,h:8},
 {k:'brioche',t:27,off:-30,r:26,m:1.6,c:0xe0a458,h:16},
 {k:'toast',t:38,off:25,r:24,m:1.2,c:0xd9a066,h:10},
 {k:'succo',t:50,off:-25,r:22,m:2.2,c:0xff9a1f,h:24},
 {k:'burro',t:62,off:20,r:18,m:1.4,c:0xfff2a6,h:12},
 {k:'cereali',t:75,off:-28,r:28,m:2.6,c:0x6b8f3a,h:22},
 {k:'posata',t:88,off:30,r:16,m:0.9,c:0xc8ccd0,h:6},
 {k:'tazzina',t:104,off:-15,r:24,m:2.4,c:0xeeeeee,h:22}
];
const CARS=[
 {n:'Scatto GT',col:0xd62828,m:1.0,acc:520,max:430,steer:2.9,grip:7.5},
 {n:'Tuono V8',col:0x2b6cb0,m:1.4,acc:560,max:440,steer:2.4,grip:6.5},
 {n:'Polvere X',col:0xe0a030,m:0.9,acc:500,max:410,steer:3.1,grip:5.5},
 {n:'Lampo ZX',col:0x8e44ad,m:0.85,acc:540,max:450,steer:3.0,grip:7.0},
 {n:'Aero R',col:0x1abc9c,m:1.0,acc:530,max:445,steer:2.8,grip:7.2},
 {n:'Brezza RS',col:0xf1c40f,m:0.8,acc:510,max:420,steer:3.2,grip:6.8}
];
// ===== SCENA =====
class Race extends Phaser.Scene{
 constructor(){super('race');}
 create(){
  this.cameras.main.setBackgroundColor(0x3a2a1e);
  this.drawTable();
  this.drawTrack();
  this.props=PROPS.map(p=>this.makeProp(p));
  this.cars=[];
  for(let i=0;i<N_CARS;i++)this.cars.push(this.makeCar(i));
  this.player=this.cars[0];
  this.cursors=this.input.keyboard.createCursorKeys();
  this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE');
  this.touch={l:false,r:false,j:false};
  this.makeTouch();
  this.state='countdown';this.cd=3.2;this.t0=0;
  this.hud=this.add.text(16,12,'',{fontFamily:'monospace',fontSize:'28px',color:'#fff',stroke:'#000',strokeThickness:5}).setScrollFactor(0).setDepth(1000);
  this.big=this.add.text(0,0,'',{fontFamily:'monospace',fontSize:'120px',color:'#ffd23f',stroke:'#000',strokeThickness:10}).setOrigin(.5).setScrollFactor(0).setDepth(1001);
  this.cameras.main.setBounds(0,0,W,H);
  this.scale.on('resize',()=>this.fit());
  this.fit();
 }
 fit(){
  const w=this.scale.width,h=this.scale.height;
  const z=Math.min(w/W,h/H)*1.0;
  this.cameras.main.setZoom(Math.max(z,0.5));
  this.big.setPosition(w/2,h/2);
 }
 drawTable(){
  const g=this.add.graphics().setDepth(0);
  g.fillStyle(0x8b5a2b,1).fillRect(0,0,W,H);
  for(let y=0;y<H;y+=40){g.fillStyle(y%80?0x95612f:0x85552a,1).fillRect(0,y,W,38);}
  g.fillStyle(0xf7f1e3,1).fillRect(60,60,W-120,H-120);
  for(let x=60;x<W-60;x+=50)for(let y=60;y<H-60;y+=50){if(((x+y)/50)%2===0){g.fillStyle(0xe8dcc0,1).fillRect(x,y,50,50);}}
  g.lineStyle(10,0x5a3a1a,1).strokeRect(60,60,W-120,H-120);
 }
 drawTrack(){
  const sh=this.add.graphics().setDepth(1);
  const g=this.add.graphics().setDepth(2);
  const edge=(off)=>PATH.map((p,i)=>{const q=PATH[(i+1)%NPTS],a=Math.atan2(q.y-p.y,q.x-p.x)+Math.PI/2;return{x:p.x+Math.cos(a)*off,y:p.y+Math.sin(a)*off};});
  const outer=edge(-TRACK_HALF-14),inner=edge(TRACK_HALF+14);
  const poly=(pts,c,gr,dx,dy)=>{gr.fillStyle(c,1);gr.beginPath();gr.moveTo(pts[0].x+dx,pts[0].y+dy);for(const p of pts)gr.lineTo(p.x+dx,p.y+dy);gr.closePath();gr.fillPath();};
  // ombra del rilievo pista
  sh.fillStyle(0x000000,0.25);sh.fillCircle(0,0,0);
  for(let i=0;i<NPTS;i++){const p=PATH[i],q=PATH[(i+1)%NPTS];sh.lineStyle(TRACK_HALF*2+40,0x000000,0.22);sh.lineBetween(p.x+8,p.y+10,q.x+8,q.y+10);}
  // cordoli a spessore: lato scuro + faccia rossa/bianca
  for(let i=0;i<NPTS;i++){
   const p=PATH[i],q=PATH[(i+1)%NPTS];
   g.lineStyle(TRACK_HALF*2+38,0x7a1010,1);g.lineBetween(p.x,p.y+6,q.x,q.y+6);
  }
  for(let i=0;i<NPTS;i++){
   const p=PATH[i],q=PATH[(i+1)%NPTS];
   g.lineStyle(TRACK_HALF*2+34,i%2?0xffffff:0xd62828,1);g.lineBetween(p.x,p.y,q.x,q.y);
  }
  for(let i=0;i<NPTS;i++){
   const p=PATH[i],q=PATH[(i+1)%NPTS];
   g.lineStyle(TRACK_HALF*2,0x4a4a52,1);g.lineBetween(p.x,p.y,q.x,q.y);
  }
  // linea tratteggiata centrale
  for(let i=0;i<NPTS;i+=2){const p=PATH[i],q=PATH[(i+1)%NPTS];g.lineStyle(4,0xe8e8e8,0.8);g.lineBetween(p.x,p.y,q.x,q.y);}
  // linea di partenza a scacchi
  const p0=PATH[0],p1=PATH[1],a=Math.atan2(p1.y-p0.y,p1.x-p0.x)+Math.PI/2;
  for(let k=-8;k<8;k++){for(let j=0;j<2;j++){const px=p0.x+Math.cos(a)*(k*12+6)+Math.cos(a-Math.PI/2)*(j*12-6),py=p0.y+Math.sin(a)*(k*12+6)+Math.sin(a-Math.PI/2)*(j*12-6);g.fillStyle((k+j)%2?0xffffff:0x111111,1).fillRect(px-6,py-6,12,12);}}
 }
 makeProp(d){
  const p=PATH[d.t],q=PATH[(d.t+1)%NPTS],a=Math.atan2(q.y-p.y,q.x-p.x)+Math.PI/2;
  const x=p.x+Math.cos(a)*d.off,y=p.y+Math.sin(a)*d.off;
  const sh=this.add.ellipse(x+6,y+8,d.r*2.1,d.r*1.6,0x000000,0.3).setDepth(3);
  const side=this.add.circle(x,y+d.h*0.5,d.r,this.shade(d.c,0.6)).setDepth(4);
  const top=this.add.circle(x,y,d.r,d.c).setDepth(5);
  const hi=this.add.circle(x-d.r*0.3,y-d.r*0.3,d.r*0.3,0xffffff,0.35).setDepth(6);
  return{d,x,y,vx:0,vy:0,sh,side,top,hi,r:d.r,m:d.m,h:d.h};
 }
 shade(c,f){const r=((c>>16)&255)*f,g=((c>>8)&255)*f,b=(c&255)*f;return(r<<16)|(g<<8)|b;}
 makeCar(i){
  const d=CARS[i];
  const s=PATH[0],n=PATH[1],ang=Math.atan2(n.y-s.y,n.x-s.x);
  const row=Math.floor(i/2),col=i%2;
  const perp=ang+Math.PI/2;
  const x=s.x-Math.cos(ang)*(60+row*55)+Math.cos(perp)*(col?30:-30);
  const y=s.y-Math.sin(ang)*(60+row*55)+Math.sin(perp)*(col?30:-30);
  const gfx=this.add.graphics().setDepth(10);
  const shadow=this.add.graphics().setDepth(9);
  const label=this.add.text(0,0,d.n,{fontFamily:'monospace',fontSize:'14px',color:'#fff',stroke:'#000',strokeThickness:3}).setDepth(11).setOrigin(.5);
  return{d,i,x,y,a:ang,vx:0,vy:0,w:0,gfx,shadow,label,lap:0,next:1,progress:0,ai:i>0,tilt:0,bob:0,z:0,vz:0,jcd:0,finished:false,finTime:0,lastCp:0,stuck:0,rev:0,r:20,m:d.m,aiOff:(Math.random()-0.5)*40,aiLook:6+Math.floor(Math.random()*3)};
 }
 makeTouch(){
  const mk=(x,y,t,key)=>{
   const b=this.add.circle(0,0,56,0x000000,0.35).setScrollFactor(0).setDepth(2000).setInteractive();
   const tx=this.add.text(0,0,t,{fontSize:'44px',color:'#fff'}).setOrigin(.5).setScrollFactor(0).setDepth(2001);
   b.on('pointerdown',()=>{this.touch[key]=true;});
   b.on('pointerup',()=>{this.touch[key]=false;});
   b.on('pointerout',()=>{this.touch[key]=false;});
   return{b,tx,x,y};
  };
  this.btns=[mk(0,0,'◀','l'),mk(0,0,'▶','r'),mk(0,0,'⤒','j')];
  this.input.addPointer(3);
  this.layoutTouch();
  this.scale.on('resize',()=>this.layoutTouch());
 }
 layoutTouch(){
  const w=this.scale.width,h=this.scale.height,z=this.cameras.main.zoom||1;
  const pos=[[90,h-90],[230,h-90],[w-90,h-90]];
  this.btns.forEach((o,i)=>{o.b.setPosition(pos[i][0],pos[i][1]);o.tx.setPosition(pos[i][0],pos[i][1]);});
 }
 update(time,dt){
  dt=Math.min(dt/1000,0.033);
  if(this.state==='countdown'){
   this.cd-=dt;
   this.big.setText(this.cd>0.2?String(Math.ceil(this.cd)):'VIA!');
   if(this.cd<=0){this.state='race';this.t0=time;this.big.setText('');}
  }
  if(this.state==='race'||this.state==='countdown'){
   const go=this.state==='race';
   for(const c of this.cars)this.stepCar(c,dt,go);
   this.collide(dt);
   this.stepProps(dt);
  }
  this.updateRanks();
  this.draw();
  if(this.state==='race')this.checkEnd(time);
  this.updateHud(time);
  const pc=this.player;
  const cam=this.cameras.main;
  cam.centerOn(W/2,H/2);
 }
 input_(c){
  if(c.ai)return this.aiInput(c);
  let steer=0,thr=1,brake=0,jump=false;
  const k=this.keys,cu=this.cursors;
  if(cu.left.isDown||k.A.isDown||this.touch.l)steer-=1;
  if(cu.right.isDown||k.D.isDown||this.touch.r)steer+=1;
  if(cu.down.isDown||k.S.isDown)brake=1;
  if(Phaser.Input.Keyboard.JustDown(k.SPACE)||this.touch.j){jump=true;}
  return{steer,thr,brake,jump};
 }
 aiInput(c){
  const target=PATH[(c.next*1+0)%NPTS];
  const idx=this.nearestIdx(c);
  const look=PATH[(idx+c.aiLook)%NPTS];
  const q=PATH[(idx+c.aiLook+1)%NPTS],pa=Math.atan2(q.y-look.y,q.x-look.x)+Math.PI/2;
  const tx=look.x+Math.cos(pa)*c.aiOff,ty=look.y+Math.sin(pa)*c.aiOff;
  let da=Phaser.Math.Angle.Wrap(Math.atan2(ty-c.y,tx-c.x)-c.a);
  let steer=Phaser.Math.Clamp(da*2.2,-1,1);
  const sp=Math.hypot(c.vx,c.vy);
  let thr=1,brake=0;
  if(Math.abs(da)>0.7&&sp>250){thr=0.4;brake=0.3;}
  if(c.stuck>1.2){c.rev=0.9;c.stuck=0;}
  if(c.rev>0){c.rev-=0.016;return{steer:-steer,thr:0,brake:1,jump:false};}
  return{steer,thr,brake,jump:false};
 }
 nearestIdx(c){
  let b=0,bd=1e9;
  for(let i=0;i<NPTS;i++){const d=(PATH[i].x-c.x)**2+(PATH[i].y-c.y)**2;if(d<bd){bd=d;b=i;}}
  return b;
 }
 stepCar(c,dt,go){
  const inp=go&&!c.finished?this.input_(c):{steer:0,thr:0,brake:1,jump:false};
  const d=c.d;
  const fx=Math.cos(c.a),fy=Math.sin(c.a);
  const sx=-fy,sy=fx;
  let vf=c.vx*fx+c.vy*fy,vs=c.vx*sx+c.vy*sy;
  const sp=Math.hypot(c.vx,c.vy);
  // fuori pista
  const idx=this.nearestIdx(c);
  const dist=Math.hypot(PATH[idx].x-c.x,PATH[idx].y-c.y);
  const off=dist>TRACK_HALF+4;
  const fric=off?0.55:1;
  const air=c.z>1;
  // salto
  c.jcd=Math.max(0,c.jcd-dt);
  if(inp.jump&&!air&&c.jcd<=0){c.vz=260;c.jcd=1.5;}
  if(air||c.vz>0){c.vz-=900*dt;c.z+=c.vz*dt;if(c.z<=0){c.z=0;c.vz=0;c.bob=-3;}}
  const steerMul=air?0.35:1;
  // motore
  const acc=d.acc*fric*(air?0.2:1);
  if(inp.thr>0)vf+=acc*inp.thr*dt/c.m*(1-Math.min(vf/(d.max*fric),1)*0.85);
  if(inp.brake>0){if(vf>5)vf-=700*dt;else vf-=260*dt/c.m;}
  // resistenza
  vf-=vf*0.35*dt;
  vf=Phaser.Math.Clamp(vf,-170,d.max*fric);
  // grip laterale (derapata)
  const gr=d.grip*(air?0.1:1)*(off?0.7:1);
  vs-=vs*Math.min(1,gr*dt);
  // sterzo proporzionale alla velocita
  const sf=Phaser.Math.Clamp(Math.abs(vf)/160,0,1)*(vf<0?-1:1);
  const targetW=inp.steer*d.steer*sf*steerMul;
  c.w+=(targetW-c.w)*Math.min(1,9*dt);
  c.a+=c.w*dt;
  const nfx=Math.cos(c.a),nfy=Math.sin(c.a),nsx=-nfy,nsy=nfx;
  c.vx=nfx*vf+nsx*vs;c.vy=nfy*vf+nsy*vs;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  // limiti tavolo
  c.x=Phaser.Math.Clamp(c.x,90,W-90);c.y=Phaser.Math.Clamp(c.y,90,H-90);
  // inclinazione e sospensioni (peso)
  const lat=vs*0.0016+c.w*0.04;
  c.tilt+=(lat-c.tilt)*Math.min(1,8*dt);
  c.bob+=(-c.bob*10*dt);
  c.bob+=(Math.sin(time_()*0.02+c.i)*0.0)*dt;
  // anti-stuck
  if(go&&!c.finished){if(Math.hypot(c.vx,c.vy)<25)c.stuck+=dt;else c.stuck=Math.max(0,c.stuck-dt*2);}
  // checkpoint
  const ci=this.nearestIdx(c);
  const cp=CHECKS[c.next%CHECKS.length];
  let dd=Math.abs(ci-cp);dd=Math.min(dd,NPTS-dd);
  if(dd<=4&&!c.finished){
   c.next++;
   if(c.next%CHECKS.length===1&&c.next>1){}
   if((c.next-1)%CHECKS.length===0&&c.next>1){c.lap++;if(c.lap>=LAPS){c.finished=true;c.finTime=this.time.now-this.t0;}}
  }
  c.progress=c.lap*NPTS+(ci<NPTS/2&&c.next%CHECKS.length===1?NPTS+ci:ci);
 }
 collide(dt){
  const cs=this.cars;
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
   const a=cs[i],b=cs[j];
   if((a.z>14)!==(b.z>14))continue;
   const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mn=a.r+b.r;
   if(d<mn&&d>0.001){
    const nx=dx/d,ny=dy/d,ov=mn-d;
    const tm=a.m+b.m;
    a.x-=nx*ov*(b.m/tm);a.y-=ny*ov*(b.m/tm);
    b.x+=nx*ov*(a.m/tm);b.y+=ny*ov*(a.m/tm);
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rv<0){
     const jn=-(1+0.35)*rv/(1/a.m+1/b.m);
     a.vx-=jn*nx/a.m;a.vy-=jn*ny/a.m;
     b.vx+=jn*nx/b.m;b.vy+=jn*ny/b.m;
     a.bob=Math.min(6,-rv*0.02);b.bob=Math.min(6,-rv*0.02);
    }
   }
  }
  for(const c of cs)for(const p of this.props){
   const dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy),mn=c.r+p.r;
   if(d<mn&&d>0.001&&c.z<p.h){
    const nx=dx/d,ny=dy/d,ov=mn-d;
    const tm=c.m+p.m;
    c.x-=nx*ov*(p.m/tm);c.y-=ny*ov*(p.m/tm);
    p.x+=nx*ov*(c.m/tm);p.y+=ny*ov*(c.m/tm);
    const rv=(p.vx-c.vx)*nx+(p.vy-c.vy)*ny;
    if(rv<0){
     const jn=-(1+0.25)*rv/(1/c.m+1/p.m);
     c.vx-=jn*nx/c.m;c.vy-=jn*ny/c.m;
     p.vx+=jn*nx/p.m;p.vy+=jn*ny/p.m;
     c.bob=Math.min(7,-rv*0.025);
    }
   }
  }
 }
 stepProps(dt){
  for(const p of this.props){
   p.x+=p.vx*dt;p.y+=p.vy*dt;
   const f=Math.exp(-2.2*dt);p.vx*=f;p.vy*=f;
   p.x=Phaser.Math.Clamp(p.x,90,W-90);p.y=Phaser.Math.Clamp(p.y,90,H-90);
   for(const q of this.props){if(q===p)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),mn=p.r+q.r;
    if(d<mn&&d>0.001){const nx=dx/d,ny=dy/d,ov=(mn-d)/2;p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;}
   }
   p.sh.setPosition(p.x+6,p.y+8);
   p.side.setPosition(p.x,p.y+p.h*0.5);
   p.top.setPosition(p.x,p.y);
   p.hi.setPosition(p.x-p.r*0.3,p.y-p.r*0.3);
  }
 }
 updateRanks(){
  this.order=[...this.cars].sort((a,b)=>(b.finished-a.finished)||(a.finished&&b.finished?a.finTime-b.finTime:b.progress-a.progress));
 }
 // ===== DISEGNO AUTO 2.5D A STRATI =====
 draw(){
  for(const c of this.cars){
   const g=c.gfx,s=c.shadow;
   g.clear();s.clear();
   const lift=c.z*0.35;
   // ombra a terra
   s.fillStyle(0x000000,Math.max(0.12,0.3-c.z*0.002));
   s.save();s.translateCanvas(c.x+5+c.z*0.12,c.y+7+c.z*0.18);s.rotateCanvas(c.a);
   s.fillRoundedRect(-24,-13,48,26,8);s.restore();
   g.save();g.translateCanvas(c.x,c.y-lift);g.rotateCanvas(c.a);
   const col=c.d.col,dark=this.shade(col,0.55),mid=this.shade(col,0.8);
   const sq=1+c.bob*0.012;
   const tl=Phaser.Math.Clamp(c.tilt,-3.5,3.5);
   // ruote (spessore)
   g.fillStyle(0x111111,1);
   for(const[wx,wy]of[[-14,-14],[12,-14],[-14,10],[12,10]]){g.fillRoundedRect(wx,wy+tl*0.4,10,6,2);}
   // strati di spessore: dal basso verso l'alto
   const layers=[{y:4,c:dark,h:1},{y:3,c:dark,h:1},{y:2,c:mid,h:1},{y:1,c:mid,h:1},{y:0,c:col,h:1}];
   for(const L of layers){
    g.fillStyle(L.c,1);
    g.fillRoundedRect(-22,-11+L.y*0.8+tl*(L.y*0.25),44,22*sq,6);
   }
   // cofano e lunotto
   g.fillStyle(this.shade(col,1.12),1);g.fillRoundedRect(8,-8+tl*0.2,12,16,4);
   // abitacolo (parabrezza, tetto, lunotto)
   g.fillStyle(0x1b2a3a,1);g.fillRoundedRect(-8,-9+tl*0.4,16,18,3);
   g.fillStyle(0x8fb8d8,0.85);g.fillRect(4,-8+tl*0.4,4,16);
   g.fillStyle(0x2c3e50,1);g.fillRect(-7,-8+tl*0.4,10,16);
   g.fillStyle(this.shade(col,1.2),1);g.fillRoundedRect(-6,-7+tl*0.5,9,14,2);
   // spoiler
   g.fillStyle(0x111111,1);g.fillRect(-23,-10,3,20);
   // fari e fanali
   g.fillStyle(0xfff5b0,1);g.fillRect(20,-9,3,5);g.fillRect(20,4,3,5);
   g.fillStyle(0xff3030,1);g.fillRect(-23,-9,2,4);g.fillRect(-23,5,2,4);
   // paraurti
   g.fillStyle(0x111111,1);g.fillRect(21,-10,2,20);
   g.restore();
   c.label.setPosition(c.x,c.y-34-lift);c.label.setVisible(c.ai?false:true);
   g.setDepth(10+c.y*0.001);
  }
 }
 checkEnd(time){
  if(this.player.finished&&!this.ended){
   this.ended=true;
   const pos=this.order.indexOf(this.player)+1;
   this.big.setFontSize(64).setText('Arrivo: '+pos+'°\nTocca per riavviare');
   this.state='done';
   this.input.once('pointerdown',()=>this.scene.restart());
   this.input.keyboard.once('keydown-R',()=>this.scene.restart());
  }
 }
 updateHud(time){
  const p=this.player,pos=this.order.indexOf(p)+1;
  const t=this.state==='race'?((time-this.t0)/1000).toFixed(1):'0.0';
  this.hud.setText('Pos '+pos+'/'+N_CARS+'  Giro '+Math.min(p.lap+1,LAPS)+'/'+LAPS+'  '+t+'s');
 }
}
function time_(){return performance.now();}
new Phaser.Game({
 type:Phaser.AUTO,parent:'game',backgroundColor:'#1b1410',
 scale:{mode:Phaser.Scale.RESIZE,width:window.innerWidth,height:window.innerHeight},
 input:{activePointers:4},
 scene:[Race]
});
</script>
