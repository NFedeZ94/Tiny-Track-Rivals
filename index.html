// ================= AUDIO (WebAudio, nessun file esterno) =================
const Sfx={
 ctx:null,eng:null,
 init(){
  if(this.ctx)return;
  try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
 },
 resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 beep(f,d,type,vol,slide){
  if(!SAVE.sound||!this.ctx)return;
  const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d);
 },
 jingle(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.16,'square',0.12),i*110));},
 count(){this.beep(440,0.18,'square',0.14);},
 go(){this.beep(880,0.4,'square',0.16);},
 hit(v){this.beep(120+Math.random()*40,0.12,'sawtooth',Math.min(0.2,0.04+v*0.0004),60);},
 pick(){this.beep(700,0.1,'triangle',0.14,1400);},
 turbo(){this.beep(300,0.5,'sawtooth',0.12,900);},
 oil(){this.beep(200,0.25,'sine',0.14,80);},
 claw(){this.beep(500,0.2,'square',0.12,250);},
 startEngine(base){
  this.init();if(!this.ctx||this.eng)return;
  const o=this.ctx.createOscillator(),o2=this.ctx.createOscillator(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();
  o.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=700;g.gain.value=0;
  o.connect(f);o2.connect(f);f.connect(g);g.connect(this.ctx.destination);o.start();o2.start();
  this.eng={o,o2,g,f,base};
 },
 engine(speedRatio,base){
  if(!this.eng||!this.ctx)return;
  const e=this.eng,fr=base*(0.8+speedRatio*2.2);
  e.o.frequency.setTargetAtTime(fr,this.ctx.currentTime,0.08);
  e.o2.frequency.setTargetAtTime(fr*0.5,this.ctx.currentTime,0.08);
  e.f.frequency.setTargetAtTime(500+speedRatio*1400,this.ctx.currentTime,0.1);
  e.g.gain.setTargetAtTime(SAVE.sound?0.035+speedRatio*0.05:0,this.ctx.currentTime,0.1);
 },
 stopEngine(){
  if(!this.eng)return;
  try{this.eng.g.gain.setTargetAtTime(0,this.ctx.currentTime,0.05);this.eng.o.stop(this.ctx.currentTime+0.3);this.eng.o2.stop(this.ctx.currentTime+0.3);}catch(e){}
  this.eng=null;
 }
};

const ITEM_NAME={turbo:'TURBO',oil:'OLIO',claw:'PINZA'};
class Race extends Phaser.Scene{
 constructor(){super('race');}
 init(d){this.carId=(d&&d.carId)||SAVE.car;}
 create(){
  const cam=this.cameras.main;
  cam.setBackgroundColor(0x2a1d14);
  // seconda camera solo per l'interfaccia: non viene zoomata ne' schiacciata
  this.uiCam=this.cameras.add(0,0,this.scale.width,this.scale.height);
  this.wd=o=>{this.uiCam.ignore(o);return o;};
  this.ui=o=>{cam.ignore(o);return o;};
  this.buildWorld();
  this.wd(this.add.image(0,0,'ttr_world').setOrigin(0,0).setDepth(0));
  this.props=PROP_DEFS.map(d=>this.makeProp(d));
  this.makePowerups();
  this.oils=[];
  const mine=CAR_DEFS.find(c=>c.id===this.carId)||CAR_DEFS[0];
  const others=CAR_DEFS.filter(c=>c.id!==mine.id).slice(0,N_CARS-1);
  this.cars=[mine,...others].map((d,i)=>this.makeCar(d,i));
  this.player=this.cars[0];
  this.order=[...this.cars];
  this.cursors=this.input.keyboard.createCursorKeys();
  this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE,E,SHIFT');
  this.input.addPointer(3);
  this.touch={l:false,r:false,j:false,u:false,uEdge:false};
  this.state='countdown';this.cd=3;this.lastN=4;this.raceT=0;this.viaT=0;
  this.ended=false;this.canExit=false;this.hitCd=0;
  this.makeUI();
  cam.setBounds(0,0,W,H);
  cam.startFollow(this.player.pivot,true,0.12,0.12);
  this.applyView();this.layoutUI();
  cam.centerOn(this.player.x,this.player.y);
  this._rs=()=>{this.applyView();this.layoutUI();};
  this.scale.on('resize',this._rs);
  this.input.on('pointerdown',p=>this.onTap(p));
  this.input.keyboard.on('keydown-V',()=>this.toggleView());
  this.input.keyboard.on('keydown-ENTER',()=>{if(this.canExit)this.exit();});
  this.events.once('shutdown',()=>{this.scale.off('resize',this._rs);Sfx.stopEngine();});
  this.engBase=60+(1.7-this.player.d.m)*50;
  Sfx.resume();Sfx.startEngine(this.engBase);
 }
 // ---------- tavolo e pista: disegnati una volta sola su una texture ----------
 buildWorld(){
  if(this.textures.exists('ttr_world'))return;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const hex=(c,a)=>'rgba('+((c>>16)&255)+','+((c>>8)&255)+','+(c&255)+','+(a==null?1:a)+')';
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();};
  const disc=(cx,cy,r,c,a)=>{x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fillStyle=hex(c,a);x.fill();};
  // legno
  x.fillStyle=hex(0x8b5a2b);x.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=44){x.fillStyle=hex(((y/44)|0)%2?0x94622f:0x84552a);x.fillRect(0,y,W,42);}
  x.strokeStyle=hex(0x6e4521,0.5);x.lineWidth=1;
  for(let i=0;i<70;i++){const gy=Math.random()*H,gx=Math.random()*W;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+60+Math.random()*120,gy);x.stroke();}
  // tovaglia a quadri
  const m=70;
  x.fillStyle='rgba(0,0,0,0.3)';x.fillRect(m+8,m+10,W-2*m,H-2*m);
  x.fillStyle=hex(0xf7f1e3);x.fillRect(m,m,W-2*m,H-2*m);
  for(let gx=m;gx<W-m;gx+=56)for(let gy=m;gy<H-m;gy+=56){if((((gx-m)/56|0)+((gy-m)/56|0))%2===0){x.fillStyle=hex(0xe9a9a0,0.55);x.fillRect(gx,gy,Math.min(56,W-m-gx),Math.min(56,H-m-gy));}}
  x.lineWidth=10;x.strokeStyle=hex(0x5a3a1a);x.strokeRect(m,m,W-2*m,H-2*m);
  // briciole
  for(let i=0;i<110;i++){x.fillStyle=hex(0xc89b5a);x.fillRect(m+20+Math.random()*(W-2*m-40),m+20+Math.random()*(H-2*m-40),2+Math.random()*3,2+Math.random()*3);}
  // piatti e cibo fuori pista
  const plate=(px,py,r)=>{disc(px+8,py+10,r,0x000000,0.22);disc(px,py,r,0xd8d2c4);disc(px,py,r*0.88,0xffffff);disc(px,py,r*0.62,0xeeeae0);};
  plate(250,250,120);plate(W-260,H-250,120);plate(W-260,250,95);plate(260,H-250,95);
  x.fillStyle=hex(0xffffff);x.beginPath();x.ellipse(250,250,56,46,0.3,0,Math.PI*2);x.fill();
  disc(262,246,26,0xffc21a);disc(256,238,9,0xffe27a);
  disc(W-262,H-250,34,0xc0392b);disc(W-270,H-258,10,0xe8685a,0.7);
  disc(W-260,250,44,0xe0a458);disc(W-260,244,40,0xeab872);disc(W-260,236,14,0xfff2a6);
  disc(246,H-250,26,0xc98a4b);disc(280,H-232,22,0xd9a066);
  const bread=(bx,by)=>{x.fillStyle='rgba(0,0,0,0.2)';rr(bx+7,by+9,86,80,18);x.fill();x.fillStyle=hex(0xcda26a);rr(bx,by,86,80,18);x.fill();x.fillStyle=hex(0xf1d8a1);rr(bx+7,by+7,72,66,14);x.fill();};
  bread(W-520,110);bread(150,H-430);bread(W/2-40,100);
  const cup=(cx,cy,r)=>{disc(cx+6,cy+8,r,0x000000,0.22);disc(cx,cy,r,0xf4f0e8);disc(cx,cy,r*0.7,0x4a2c17);x.fillStyle=hex(0xf4f0e8);rr(cx+r*0.8,cy-r*0.22,r*0.5,r*0.44,6);x.fill();};
  cup(W/2+160,H-120,34);cup(W/2-220,110,34);
  // ---- pista: campioni a distanza uniforme, cordoli con strisce regolari ----
  const fine=[];{const N=6000;let pv=trackPoint(0),acc=0;fine.push({x:pv.x,y:pv.y,s:0});for(let i=1;i<=N;i++){const pt=trackPoint(i/N*Math.PI*2);acc+=Math.hypot(pt.x-pv.x,pt.y-pv.y);fine.push({x:pt.x,y:pt.y,s:acc});pv=pt;}}
  const total=fine[fine.length-1].s,ns=2*Math.round(total/48),n=ns*3,step=total/n;
  const D=[];{let j=0;for(let k=0;k<n;k++){const s=k*step;while(fine[j+1].s<s)j++;const f=(s-fine[j].s)/((fine[j+1].s-fine[j].s)||1);D.push({x:fine[j].x+(fine[j+1].x-fine[j].x)*f,y:fine[j].y+(fine[j+1].y-fine[j].y)*f});}}
  for(let k=0;k<n;k++){const a=D[(k+n-1)%n],b=D[(k+1)%n],an=Math.atan2(b.y-a.y,b.x-a.x);D[k].an=an;D[k].nx=Math.cos(an+Math.PI/2);D[k].ny=Math.sin(an+Math.PI/2);}
  const edge=o=>D.map(p=>({x:p.x+p.nx*o,y:p.y+p.ny*o}));
  const T=TRACK_HALF,K=T+26;
  const ring=(o1,o2,dx,dy,fill)=>{const A=edge(o1),B=edge(o2);x.beginPath();A.forEach((p,i)=>{if(i)x.lineTo(p.x+dx,p.y+dy);else x.moveTo(p.x+dx,p.y+dy);});x.closePath();B.forEach((p,i)=>{if(i)x.lineTo(p.x+dx,p.y+dy);else x.moveTo(p.x+dx,p.y+dy);});x.closePath();x.fillStyle=fill;x.fill('evenodd');};
  const line=(o,col,w)=>{const A=edge(o);x.beginPath();A.forEach((p,i)=>{if(i)x.lineTo(p.x,p.y);else x.moveTo(p.x,p.y);});x.closePath();x.strokeStyle=col;x.lineWidth=w;x.stroke();};
  ring(-K-3,K+3,9,12,'rgba(0,0,0,0.28)');
  ring(-K,K,0,8,hex(0x4a0c0c));
  const stripe=(o1,o2)=>{for(let k=0;k<n;k++){const p=D[k],q=D[(k+1)%n],c=(Math.floor(k/3)%2)?hex(0xf4f4f4):hex(0xd62828);x.beginPath();x.moveTo(p.x+p.nx*o1,p.y+p.ny*o1);x.lineTo(p.x+p.nx*o2,p.y+p.ny*o2);x.lineTo(q.x+q.nx*o2,q.y+q.ny*o2);x.lineTo(q.x+q.nx*o1,q.y+q.ny*o1);x.closePath();x.fillStyle=c;x.fill();x.strokeStyle=c;x.lineWidth=0.8;x.stroke();}};
  stripe(T,K);stripe(-K,-T);
  line(K,'rgba(255,255,255,0.4)',2);line(-K,'rgba(255,255,255,0.4)',2);
  line(T,'rgba(0,0,0,0.4)',2);line(-T,'rgba(0,0,0,0.4)',2);
  ring(-T,T,0,0,hex(0x4a4a52));
  ring(-T+8,T-8,0,0,hex(0x52525c));
  line(T-10,'rgba(255,255,255,0.5)',3);line(-(T-10),'rgba(255,255,255,0.5)',3);
  x.strokeStyle='rgba(240,240,240,0.8)';x.lineWidth=4;
  for(let k=0;k<n;k++){if(k%3!==2){const p=D[k],q=D[(k+1)%n];x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}}
  // linea di partenza a scacchi e pali
  const s0=D[0];
  x.save();x.translate(s0.x,s0.y);x.rotate(s0.an);
  for(let r=0;r<2;r++)for(let c=-8;c<8;c++){x.fillStyle=((r+c)%2===0)?'#ffffff':'#111111';x.fillRect(r*12-12,c*12,12,12);}
  x.restore();
  for(const o of[K+16,-K-16]){const px=s0.x+s0.nx*o,py=s0.y+s0.ny*o;disc(px+5,py+8,12,0x000000,0.3);disc(px,py,11,0x2a2a2a);disc(px-3,py-3,5,0x666666);}
  this.textures.addCanvas('ttr_world',cv);
 }

 update(time,dtms){
  const dt=Math.min(dtms/1000,0.033);
  this.pollTouch();
  this.hitCd=Math.max(0,this.hitCd-dt);
  if(this.state==='countdown'){
   this.cd-=dt;
   if(this.cd<=0){this.state='race';this.raceT=0;this.viaT=0.8;this.big.setText('VIA!');Sfx.go();}
   else{const n=Math.ceil(this.cd);if(n!==this.lastN){this.lastN=n;this.big.setText(String(n));Sfx.count();}}
  }else{
   this.raceT+=dt;
   if(this.viaT>0){this.viaT-=dt;if(this.viaT<=0&&!this.ended)this.big.setText('');}
  }
  const racing=this.state==='race';
  const p=this.player;
  for(const c of this.cars)c.idx=this.nearestIdx(c);
  if(racing){
   const ks=this.keys;
   if(!p.finished&&(Phaser.Input.Keyboard.JustDown(ks.E)||Phaser.Input.Keyboard.JustDown(ks.SHIFT)||this.touch.uEdge))this.useItem(p);
   for(const c of this.cars){if(c.ai&&c.item&&!c.finished){c.itemWait-=dt;if(c.itemWait<=0)this.useItem(c);}}
  }
  for(const c of this.cars)this.stepCar(c,dt,racing);
  if(racing){
   this.collide();this.stepProps(dt);this.stepPowerups(dt);this.stepOils(dt);
   for(const c of this.cars)this.progress(c);
  }
  this.order=[...this.cars].sort((a,b)=>(b.finished-a.finished)||((a.finished&&b.finished)?(a.finTime-b.finTime):(b.prog-a.prog)));
  if(p.finished&&!this.ended){
   this.ended=true;
   const ps=this.order.indexOf(p)+1;
   this.big.setFontSize(44).setText('Arrivo: '+ps+'\u00b0  ('+p.finTime.toFixed(1)+' s)\nTocca per continuare');
   Sfx.jingle();
   this.time.delayedCall(900,()=>{this.canExit=true;});
  }
  const pos=this.order.indexOf(p)+1;
  this.hud.setText('Pos '+pos+'/'+N_CARS+'   Giro '+Math.min(p.lap+1,LAPS)+'/'+LAPS+'   '+(p.finished?p.finTime:this.raceT).toFixed(1)+' s');
  this.itemTx.setText(p.item?('Oggetto: '+ITEM_NAME[p.item]+'  \u2605'):'');
  Sfx.engine(Math.min(Math.hypot(p.vx,p.vy)/p.d.max,1.3),this.engBase);
  this.drawButtons();
  this.draw(time);
  p.pivot.setPosition(p.x,p.y);

 stepCar(c,dt,racing){
  const d=c.d;
  c.jcd=Math.max(0,c.jcd-dt);c.boost=Math.max(0,c.boost-dt);c.oilT=Math.max(0,c.oilT-dt);
  c.slow=Math.max(0,c.slow-dt);c.clawFx=Math.max(0,c.clawFx-dt);
  let inp;
  if(c.finished)inp=this.aiInput(c,true);
  else if(racing)inp=this.readInput(c);
  else{c.vx=0;c.vy=0;c.w=0;c.tilt*=0.9;c.bob*=0.9;return;}   // griglia: ferme fino al via
  if(c.oilT>0){   // sull'olio: l'auto gira su se stessa e scivola
   c.a+=c.spin*dt;c.spin*=Math.exp(-1.0*dt);c.w=0;
   c.vx-=c.vx*0.6*dt;c.vy-=c.vy*0.6*dt;
   c.x+=c.vx*dt;c.y+=c.vy*dt;
   c.x=Phaser.Math.Clamp(c.x,110,W-110);c.y=Phaser.Math.Clamp(c.y,110,H-110);
   c.tilt+=((c.spin*0.2)-c.tilt)*Math.min(1,8*dt);
   return;
  }
  c.spin=0;
  const fx=Math.cos(c.a),fy=Math.sin(c.a),sx=-fy,sy=fx;
  let vf=c.vx*fx+c.vy*fy,vs=c.vx*sx+c.vy*sy;
  const dist=Math.hypot(PATH[c.idx].x-c.x,PATH[c.idx].y-c.y);
  const off=dist>TRACK_HALF+26;
  const fric=off?0.55:1,air=c.z>1;
  if(inp.jump&&!air&&c.jcd<=0){c.vz=260;c.jcd=1.5;}
  if(air||c.vz>0){c.vz-=900*dt;c.z+=c.vz*dt;if(c.z<=0){c.z=0;c.vz=0;c.bob=-3;}}
  const bst=c.boost>0;
  const vmax=d.max*c.skill*fric*(bst?1.35:1)*(c.slow>0?0.45:1);
  const acc=d.acc*c.skill*fric*(air?0.2:1)*(bst?2.4:1);
  if(inp.thr>0&&vf<vmax)vf+=acc*inp.thr*dt/c.m*(1-Math.min(Math.max(vf,0)/vmax,1)*0.85);
  if(vf>vmax)vf+=(vmax-vf)*Math.min(1,4*dt);
  // freno: rallenta fino a zero; la retromarcia c'e' solo se la chiede il giocatore da fermo
  if(inp.brake>0){
   if(vf>6)vf=Math.max(0,vf-(c.finished?340:700)*inp.brake*dt);
   else if(inp.rev)vf-=260*dt/c.m;
   else vf*=Math.max(0,1-10*dt);
  }
  vf-=vf*0.35*dt;
  vf=Math.max(vf,-170);
  if(c.finished&&Math.abs(vf)<4)vf=0;
  vs-=vs*Math.min(1,d.grip*(air?0.1:1)*(off?0.7:1)*dt);
  const sf=Phaser.Math.Clamp(Math.abs(vf)/160,0,1)*(vf<0?-1:1);
  c.w+=(inp.steer*d.steer*sf*(air?0.35:1)-c.w)*Math.min(1,9*dt);
  c.a+=c.w*dt;
  const nfx=Math.cos(c.a),nfy=Math.sin(c.a);
  c.vx=nfx*vf-nfy*vs;c.vy=nfy*vf+nfx*vs;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  c.x=Phaser.Math.Clamp(c.x,110,W-110);c.y=Phaser.Math.Clamp(c.y,110,H-110);
  c.tilt+=((vs*0.0016+c.w*0.04)-c.tilt)*Math.min(1,8*dt);

 }
 progress(c){

  const cs=this.cars;

   const a=cs[i],b=cs[j];
   if(a.finished||b.finished)continue;
   if((a.z>14)!==(b.z>14))continue;
   const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy),mn=a.r+b.r;
   if(dd<mn&&dd>0.001){
    const nx=dx/dd,ny=dy/dd,ov=mn-dd,tm=a.m+b.m;
    a.x-=nx*ov*(b.m/tm);a.y-=ny*ov*(b.m/tm);b.x+=nx*ov*(a.m/tm);b.y+=ny*ov*(a.m/tm);
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rv<0){const jn=-1.35*rv/(1/a.m+1/b.m);a.vx-=jn*nx/a.m;a.vy-=jn*ny/a.m;b.vx+=jn*nx/b.m;b.vy+=jn*ny/b.m;a.bob=Math.min(6,-rv*0.02);b.bob=Math.min(6,-rv*0.02);this.bump(a,-rv);this.bump(b,-rv);}
   }
  }
  for(const c of cs)for(const p of this.props){
   const dx=p.x-c.x,dy=p.y-c.y,dd=Math.hypot(dx,dy),mn=c.r+p.r*0.9;
   if(dd<mn&&dd>0.001&&c.z<p.h){
    const nx=dx/dd,ny=dy/dd,ov=mn-dd,tm=c.m+p.m;
    c.x-=nx*ov*(p.m/tm);c.y-=ny*ov*(p.m/tm);p.x+=nx*ov*(c.m/tm);p.y+=ny*ov*(c.m/tm);
    const rv=(p.vx-c.vx)*nx+(p.vy-c.vy)*ny;
    if(rv<0){const jn=-1.25*rv/(1/c.m+1/p.m);c.vx-=jn*nx/c.m;c.vy-=jn*ny/c.m;p.vx+=jn*nx/p.m;p.vy+=jn*ny/p.m;c.bob=Math.min(7,-rv*0.025);p.spin=(Math.random()-0.5)*4;this.bump(c,-rv);}
   }
  }
 }
 bump(c,v){if(c===this.player&&this.hitCd<=0&&v>40){Sfx.hit(v);this.hitCd=0.12;}}
 stepProps(dt){
  for(const p of this.props){
   p.x+=p.vx*dt;p.y+=p.vy*dt;
   const f=Math.exp(-2.2*dt);p.vx*=f;p.vy*=f;
   p.rot+=p.spin*dt;p.spin*=Math.exp(-3*dt);
   p.x=Phaser.Math.Clamp(p.x,110,W-110);p.y=Phaser.Math.Clamp(p.y,110,H-110);
   for(const q of this.props){if(q===p)continue;const dx=q.x-p.x,dy=q.y-p.y,dd=Math.hypot(dx,dy),mn=p.r+q.r;if(dd<mn&&dd>0.001){const nx=dx/dd,ny=dy/dd,ov=(mn-dd)/2;p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;}}
   p.sh.setPosition(p.x+7,p.y+10);p.g.setPosition(p.x,p.y);p.g.setRotation(p.rot);
  }
 }
 stepPowerups(dt){
  for(const u of this.pus){
   u.ph+=dt*3;
   if(!u.on){u.cd-=dt;if(u.cd<=0)u.on=true;}
   u.g.setVisible(u.on);u.sh.setVisible(u.on);
   if(!u.on)continue;
   u.g.setPosition(u.x,u.y-8+Math.sin(u.ph)*3);
   u.g.setScale(1+Math.sin(u.ph*1.7)*0.06);
   for(const c of this.cars){
    if(c.item||c.finished||c.z>10)continue;
    if(Math.hypot(c.x-u.x,c.y-u.y)<c.r+16){
     c.item=['turbo','oil','claw'][Math.floor(Math.random()*3)];
     c.itemWait=1+Math.random()*2;
     u.on=false;u.cd=6;
     if(c===this.player)Sfx.pick();
     break;
    }
   }
  }
 }
 stepOils(dt){
  for(let i=this.oils.length-1;i>=0;i--){
   const o=this.oils[i];o.t-=dt;
   if(o.t<=0){o.g.destroy();this.oils.splice(i,1);continue;}
   o.g.setAlpha(Math.min(1,o.t/2));
   for(const c of this.cars){
    if(c.oilT>0||c.finished||c.z>8)continue;
    if(c===o.owner&&o.t>11)continue;
    if(Math.hypot(c.x-o.x,c.y-o.y)<o.r+8){
     c.oilT=1.3;c.spin=(Math.random()<0.5?-1:1)*(5+Math.random()*2);
     if(c===this.player)Sfx.oil();
    }
   }
  }
 }
 drawButtons(){
  const g=this.btnG;g.clear();
  for(const b of this.btns){
   const on=this.touch[b.key];
   g.fillStyle(0x000000,on?0.6:0.35);g.fillCircle(b.x,b.y,b.r);
   g.lineStyle(3,0xffffff,on?0.9:0.45);g.strokeCircle(b.x,b.y,b.r);
   if(b.key==='u'&&this.player.item){g.lineStyle(5,0xffd23f,1);g.strokeCircle(b.x,b.y,b.r);}
  }
 }
 draw(time){
  for(const c of this.cars){
   const g=c.gfx,s=c.shadow;g.clear();s.clear();
   const B=BODY[c.d.body]||BODY.hatch,lift=c.z*0.35;
   s.fillStyle(0x000000,Math.max(0.12,0.3-c.z*0.002));
   s.save();s.translateCanvas(c.x+5+c.z*0.12,c.y+7+c.z*0.18);s.rotateCanvas(c.a);
   s.fillRoundedRect(-B.l/2,-B.w/2,B.l,B.w,8);s.restore();
   g.save();g.translateCanvas(c.x,c.y-lift);g.rotateCanvas(c.a);
   if(c.boost>0){
    g.fillStyle(0xff7a00,0.9);g.fillTriangle(-B.l/2,-6,-B.l/2,6,-B.l/2-16-Math.random()*10,0);
    g.fillStyle(0xffe066,0.9);g.fillTriangle(-B.l/2,-3,-B.l/2,3,-B.l/2-8-Math.random()*5,0);
   }
   CarArt(g,c.d,c.tilt,c.bob);
   if(c.clawFx>0){g.lineStyle(3,0xffd23f,0.9);g.strokeCircle(0,0,B.l*0.7+Math.sin(time*0.02)*3);}
   g.restore();
   c.label.setPosition(c.x,c.y-34-lift).setVisible(!c.ai);
   g.setDepth(10+c.y*0.001);
  }
 }
}
 // ================= FORME DELLE AUTO =================
const BODY={
 hatch:{l:44,w:24,r:19},muscle:{l:52,w:28,r:22},buggy:{l:44,w:28,r:20},sport:{l:50,w:22,r:19},
 super:{l:50,w:24,r:20},mini:{l:38,w:22,r:17},suv:{l:52,w:28,r:23},ev:{l:46,w:24,r:20}
};
function CarArt(g,def,tilt,bob){
 const B=BODY[def.body]||BODY.hatch,col=def.col,L=B.l/2,Wd=B.w/2;
 const dark=shade(col,0.55),mid=shade(col,0.8),lite=shade(col,1.25);
 const sq=1+bob*0.012,tl=Phaser.Math.Clamp(tilt,-3.5,3.5),cy=tl*0.4;
 const pointed=(def.body==='sport'||def.body==='super'),buggy=(def.body==='buggy');
 const wl=buggy?15:((def.body==='suv'||def.body==='muscle')?12:10),ww=buggy?9:6,wy=buggy?Wd+2:Wd-1;
 g.fillStyle(0x111111,1);
 for(const wx of[-L*0.55,L*0.45])for(const sg of[-1,1])g.fillRoundedRect(wx-wl/2,sg*wy-ww/2+tl*0.4,wl,ww,2);
 const bw=buggy?B.w*0.62:B.w*0.92;
 for(const [o,c] of [[4,dark],[3,dark],[2,mid],[1,mid],[0,col]]){
  g.fillStyle(c,1);
  const yy=-bw/2+o*0.8+tl*o*0.25;
  if(pointed){g.fillRoundedRect(-L,yy,B.l*0.72,bw*sq,5);g.fillTriangle(L*0.44,yy,L*0.44,yy+bw*sq,L+1,yy+bw*sq/2);}
  else g.fillRoundedRect(-L,yy,B.l,bw*sq,def.body==='mini'?9:6);
 }
 const glass=0x1b2a3a,sky=0x8fb8d8;
 switch(def.body){
  case 'muscle':
   g.fillStyle(0xffffff,0.85);g.fillRect(-L+2,-3.2,B.l-4,2.4);g.fillRect(-L+2,0.8,B.l-4,2.4);
   g.fillStyle(glass,1);g.fillRoundedRect(-L*0.45,-Wd*0.6+cy,L*0.7,Wd*1.2,3);
   g.fillStyle(lite,1);g.fillRoundedRect(-L*0.38,-Wd*0.45+cy,L*0.54,Wd*0.9,2);
   g.fillStyle(0x111111,1);g.fillRoundedRect(L*0.38,-5,L*0.4,10,3);
   break;
  case 'buggy':
   g.lineStyle(2.5,0x222222,1);g.strokeRect(-L*0.45,-bw*0.5+cy,L*0.9,bw);
   g.fillStyle(0x222222,1);g.fillRoundedRect(-L*0.2,-4,10,8,2);
   g.fillStyle(lite,1);g.fillCircle(-L*0.12,0,4);
   g.fillStyle(0x222222,1);g.fillRect(L*0.5,-bw*0.5,3,bw);
   break;
  case 'sport':
   g.fillStyle(glass,1);g.fillRoundedRect(-L*0.2,-Wd*0.45+cy,L*0.6,Wd*0.9,3);
   g.fillStyle(lite,1);g.fillRoundedRect(-L*0.12,-Wd*0.34+cy,L*0.4,Wd*0.68,2);
   g.fillStyle(0x111111,1);g.fillRect(-L-2,-Wd*0.95,4,Wd*1.9);
   g.fillStyle(0xffffff,0.8);g.fillRect(-L*0.9,-1,L*1.5,2);
   break;
  case 'super':
   g.fillStyle(glass,1);g.fillEllipse(-L*0.05,cy,L*0.75,Wd*0.95);
   g.fillStyle(sky,0.8);g.fillEllipse(L*0.05,cy-1,L*0.3,Wd*0.4);
   g.fillStyle(0x111111,1);g.fillRect(-L*0.35,-Wd*0.98,L*0.3,3);g.fillRect(-L*0.35,Wd*0.98-3,L*0.3,3);
   g.fillRect(-L-2,-Wd,3,Wd*2);
   break;
  case 'mini':
   g.fillStyle(glass,1);g.fillRoundedRect(-L*0.4,-Wd*0.55+cy,L*0.9,Wd*1.1,5);
   g.fillStyle(lite,1);g.fillRoundedRect(-L*0.3,-Wd*0.4+cy,L*0.62,Wd*0.8,4);
   g.fillStyle(0xfff5b0,1);g.fillCircle(L-4,-6,3.5);g.fillCircle(L-4,6,3.5);
   break;
  case 'suv':
   g.fillStyle(glass,1);g.fillRoundedRect(-L*0.6,-Wd*0.62+cy,L*1.15,Wd*1.24,3);
   g.fillStyle(lite,1);g.fillRoundedRect(-L*0.52,-Wd*0.5+cy,L*0.95,Wd*1.0,2);
   g.fillStyle(0x111111,1);g.fillRect(-L*0.5,-Wd*0.42+cy,L*0.9,1.5);g.fillRect(-L*0.5,Wd*0.42+cy-1.5,L*0.9,1.5);
   break;
  case 'ev':
   g.fillStyle(glass,1);g.fillRoundedRect(-L*0.35,-Wd*0.6+cy,L*0.9,Wd*1.2,6);
   g.fillStyle(sky,0.7);g.fillRoundedRect(-L*0.28,-Wd*0.5+cy,L*0.72,Wd*1.0,5);
   g.fillStyle(0x7fffd4,1);g.fillRect(L-2,-Wd*0.8,2,Wd*1.6);
   g.fillStyle(0xff3030,1);g.fillRect(-L,-Wd*0.8,2,Wd*1.6);
   break;
  default:
   g.fillStyle(glass,1);g.fillRoundedRect(-L*0.3,-Wd*0.6+cy,L*0.85,Wd*1.2,3);
   g.fillStyle(sky,0.85);g.fillRect(L*0.4,-Wd*0.55+cy,3,Wd*1.1);
   g.fillStyle(lite,1);g.fillRoundedRect(-L*0.22,-Wd*0.46+cy,L*0.55,Wd*0.92,2);
   g.fillStyle(0x111111,1);g.fillRect(-L-1,-Wd*0.8,2,Wd*1.6);
 }
 if(def.body!=='ev'){g.fillStyle(0xff3030,1);g.fillRect(-L,-Wd*0.75,2,3.5);g.fillRect(-L,Wd*0.75-3.5,2,3.5);}
 if(def.body!=='mini'){g.fillStyle(0xfff5b0,1);g.fillRect(L-3,-Wd*0.7-1,3,4);g.fillRect(L-3,Wd*0.7-3,3,4);}
}
// ================= MENU =================
class Menu extends Phaser.Scene{
 constructor(){super('menu');}
 create(){
  const w=this.scale.width,h=this.scale.height,u=Math.min(w,h);
  this.cameras.main.setBackgroundColor(0x2a1d14);
  const bg=this.add.graphics();
  bg.fillStyle(0x8b5a2b,1);bg.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=44){bg.fillStyle(((y/44)|0)%2?0x94622f:0x84552a,1);bg.fillRect(0,y,w,42);}
  const T=(x,y,s,sz,col,sw)=>this.add.text(x,y,s,{fontFamily:'monospace',fontSize:Math.floor(sz)+'px',color:col,stroke:'#000000',strokeThickness:sw||5,align:'center'}).setOrigin(0.5);
  T(w/2,h*0.15,'TINY TRACK',u*0.13,'#ffd23f',9);
  T(w/2,h*0.31,'RIVALS',u*0.13,'#ffffff',9);
  const car=CAR_DEFS.find(c=>c.id===SAVE.car)||CAR_DEFS[0];
  T(w/2,h*0.43,'Auto: '+car.n,u*0.05,'#ffffff',4);
  const btn=(cx,cy,bw,bh,label,fn,col)=>{
   const r=this.add.rectangle(cx,cy,bw,bh,col).setStrokeStyle(5,0x3a1d08).setInteractive();
   const t=T(cx,cy,label,Math.min(bh*0.46,bw/9.9),'#ffffff',5);
   r.on('pointerdown',()=>r.setAlpha(0.7));
   r.on('pointerout',()=>r.setAlpha(1));
   r.on('pointerup',()=>{r.setAlpha(1);Sfx.resume();fn(t);});
  };
  const bw=Math.min(w*0.6,440),bh=Math.max(52,h*0.13);
  btn(w/2,h*0.56,bw,bh,'GARA VELOCE',()=>{Sfx.jingle();this.scene.start('race',{carId:SAVE.car});},0xd62828);
  btn(w/2,h*0.56+bh*1.2,bw,bh,'GARAGE',()=>this.scene.start('garage'),0x2b6cb0);
  const sw=Math.min(w*0.3,250),sh=Math.max(44,h*0.1),ty=h*0.56+bh*2.4;
  btn(w/2-sw*0.55,ty,sw,sh,'VISTA: '+(SAVE.view==='tilt'?'INCLINATA':'ALTO'),(t)=>{SAVE.view=(SAVE.view==='tilt')?'top':'tilt';saveGame();t.setText('VISTA: '+(SAVE.view==='tilt'?'INCLINATA':'ALTO'));},0x556b2f);
  btn(w/2+sw*0.55,ty,sw,sh,'SUONO: '+(SAVE.sound?'SI':'NO'),(t)=>{SAVE.sound=!SAVE.sound;saveGame();t.setText('SUONO: '+(SAVE.sound?'SI':'NO'));if(SAVE.sound)Sfx.jingle();},0x556b2f);
  const rs=()=>this.scene.restart();
  this.scale.on('resize',rs);
  this.events.once('shutdown',()=>this.scale.off('resize',rs));
 }
}
// ================= GARAGE =================
class Garage extends Phaser.Scene{
 constructor(){super('garage');}
 init(d){this.sel=(d&&typeof d.sel==='number')?d.sel:Math.max(0,CAR_DEFS.findIndex(c=>c.id===SAVE.car));}
 create(){
  const w=this.scale.width,h=this.scale.height;
  this.cameras.main.setBackgroundColor(0x1f2a33);
  this.add.rectangle(w/2,h/2,w,h,0x24323d);
  const tx=(x,y,s,sz,col,o)=>this.add.text(x,y,s,Object.assign({fontFamily:'monospace',fontSize:Math.max(11,Math.floor(sz))+'px',color:col||'#ffffff',stroke:'#000000',strokeThickness:3},o||{}));
  tx(w/2,26,'GARAGE',h*0.085,'#ffd23f',{strokeThickness:7}).setOrigin(0.5);
  const pw=Math.min(w*0.36,320),gx=14,gy=58,gw=w-pw-gx*2-14,gh=h-gy-66;
  const cols=4,gap=10,cw=(gw-gap*(cols-1))/cols,ch=(gh-gap)/2;
  CAR_DEFS.forEach((c,i)=>{
   const cx=gx+(i%cols)*(cw+gap)+cw/2,cy=gy+Math.floor(i/cols)*(ch+gap)+ch/2;
   const unl=SAVE.unlocked.includes(c.id),selc=(i===this.sel);
   const card=this.add.rectangle(cx,cy,cw,ch,selc?0x3a5a2a:0x30424f).setStrokeStyle(selc?6:3,selc?0xffd23f:0x111111).setInteractive();
   card.on('pointerup',()=>this.scene.restart({sel:i}));
   const g=this.add.graphics();g.setPosition(cx,cy-ch*0.1);
   g.setScale(Math.min(cw*0.62/54,ch*0.4/30));
   CarArt(g,unl?c:Object.assign({},c,{col:0x555555}),0,0);
   tx(cx,cy+ch*0.28,c.n,cw*0.11,unl?'#ffffff':'#999999').setOrigin(0.5);
   if(c.id===SAVE.car)tx(cx,cy-ch*0.4,'IN USO',cw*0.09,'#ffd23f').setOrigin(0.5);
   else if(!unl)tx(cx,cy-ch*0.4,'BLOCCATA',cw*0.09,'#ff8888').setOrigin(0.5);
  });
  // pannello con descrizione e statistiche del modellino toccato
  const px=w-pw-14,ph=h-gy-66,c=CAR_DEFS[this.sel],unl=SAVE.unlocked.includes(c.id),use=(c.id===SAVE.car);
  this.add.rectangle(px+pw/2,gy+ph/2,pw,ph,0x1a252e).setStrokeStyle(3,0x111111);
  const lx=px+12;
  tx(lx,gy+8,c.n,h*0.055,'#ffffff',{strokeThickness:4});
  tx(lx,gy+8+h*0.075,c.desc,h*0.036,'#cfe8ff',{strokeThickness:2,wordWrap:{width:pw-24}});
  const labs=['Velocit\u00e0','Accel.','Sterzo','Grip','Impatto','Stabil.'];
  const sy=gy+8+h*0.075+h*0.16;
  labs.forEach((l,k)=>{
   const yy=sy+k*h*0.05,bx=lx+pw*0.36,bw=pw*0.5,bh2=Math.max(6,h*0.02);
   tx(lx,yy,l,h*0.032,'#ffffff',{strokeThickness:2});
   this.add.rectangle(bx+bw/2,yy+h*0.015,bw,bh2,0x0d1318);
   this.add.rectangle(bx+bw*c.stats[k]/20,yy+h*0.015,bw*c.stats[k]/10,bh2,0xffd23f);
  });
  const by=gy+ph-h*0.06,label=use?'IN USO':(unl?'SCEGLI':'BLOCCATA'),colb=use?0x3a5a2a:(unl?0xd62828:0x555555);
  const b=this.add.rectangle(px+pw/2,by,pw-24,h*0.09,colb).setStrokeStyle(4,0x3a1d08);
  tx(px+pw/2,by,label,h*0.05,'#ffffff',{strokeThickness:4}).setOrigin(0.5);
  if(unl&&!use){b.setInteractive();b.on('pointerup',()=>{SAVE.car=c.id;saveGame();this.scene.restart({sel:this.sel});});}
  const bk=this.add.rectangle(110,h-32,180,Math.max(44,h*0.1),0xd62828).setStrokeStyle(4,0x3a1d08).setInteractive();
  tx(110,h-32,'INDIETRO',h*0.05,'#ffffff',{strokeThickness:4}).setOrigin(0.5);
  bk.on('pointerup',()=>this.scene.start('menu'));
  const rs=()=>this.scene.restart({sel:this.sel});
  this.scale.on('resize',rs);
  this.events.once('shutdown',()=>this.scale.off('resize',rs));
 }
}
